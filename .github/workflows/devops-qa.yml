name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # STUFE 1: QA & SECURITY CHECKS
  qa-checks:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Terraform Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./terraform

      - name: Install & Run Ansible Lint
        working-directory: ./ansible
        run: |
          pipx install ansible-lint
          ~/.local/bin/ansible-lint .

      - name: Trivy FS Scan (Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # STUFE 2: TERRAFORM DEPLOYMENT
  terraform-deploy:
    needs: qa-checks          
    environment: Terraform-Approval 
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Proxmox Secrets from Vault
        run: |
          VAULT_TOKEN=$(curl -s --request POST --data "{\"role_id\": \"$VAULT_ROLE_ID\", \"secret_id\": \"$VAULT_SECRET_ID\"}" $VAULT_ADDR/v1/auth/approle/login | jq -r .auth.client_token)
          
          PM_SECRETS=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/proxmox)
          echo "TF_VAR_proxmox_api_url=$(echo $PM_SECRETS | jq -r .data.data.proxmox_api_url)" >> $GITHUB_ENV
          echo "TF_VAR_proxmox_api_token_id=$(echo $PM_SECRETS | jq -r .data.data.proxmox_api_token_id)" >> $GITHUB_ENV
          echo "TF_VAR_proxmox_api_token_secret=$(echo $PM_SECRETS | jq -r .data.data.proxmox_api_token_secret)" >> $GITHUB_ENV
          echo "TF_VAR_ssh_public_key=$(echo $PM_SECRETS | jq -r .data.data.ssh_public_key)" >> $GITHUB_ENV

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        working-directory: ./terraform
        run: |
          terraform init -upgrade
          terraform apply -auto-approve

  # STUFE 3: ANSIBLE CONFIGURATION
  ansible-deploy:
    needs: terraform-deploy
    environment: Ansible-Approval    
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Ansible Secrets from Vault
        run: |
          VAULT_TOKEN=$(curl -s --request POST --data "{\"role_id\": \"$VAULT_ROLE_ID\", \"secret_id\": \"$VAULT_SECRET_ID\"}" $VAULT_ADDR/v1/auth/approle/login | jq -r .auth.client_token)
          
          # SSH Key holen
          SSH_SECRET=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/ssh)
          echo "$SSH_SECRET" | jq -r '.data.data.private_key' > /tmp/ansible_vault_key
          chmod 600 /tmp/ansible_vault_key

          # App Secrets holen (Beispiele)
          CF_SECRET=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/cloudflared)
          echo "CF_TUNNEL_TOKEN=$(echo $CF_SECRET | jq -r .data.data.cloudflare_tunnel_token)" >> $GITHUB_ENV

          VW_SECRET=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/vaultwarden)
          echo "ADMIN_TOKEN=$(echo $VW_SECRET | jq -r .data.data.ADMIN_TOKEN)" >> $GITHUB_ENV

      - name: Run Ansible Playbook
        working-directory: ./ansible
        run: |
          ansible-playbook -i inventory.ini site.yml --private-key /tmp/ansible_vault_key

      - name: Cleanup SSH Key
        if: always()
        run: rm -f /tmp/ansible_vault_key