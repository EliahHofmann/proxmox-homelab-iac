name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Repo ist oeffentlich, der Runner ist self-hosted und die Vault-Credentials
# liegen in seiner Umgebung (nicht in GitHub Secrets). Ein Fork-PR duerfte
# deshalb NIE einen Job starten - er koennte die Workflow-Datei aendern und
# VAULT_ROLE_ID/VAULT_SECRET_ID ausleiten. Dieser Guard laesst nur Pushes und
# PRs aus Branches dieses Repos zu.
jobs:


  # STUFE 1: QA & SECURITY CHECKS
  qa-checks:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tfsec ist in Trivy aufgegangen; die tfsec-Action braucht Docker, Trivy
      # nicht - der Runner soll ohne Docker-Rechte auskommen.
      - name: Terraform Security Scan (Trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'false'
          cache-dir: '/home/github-runner/.cache/trivy'
          scan-type: 'config'
          scan-ref: './terraform'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # ansible-lint laeuft in eigener pipx-Umgebung und sieht die systemweit
      # installierten Collections (community.general) sonst nicht.
      - name: Install & Run Ansible Lint
        working-directory: ./ansible
        run: |
          pipx install ansible-lint
          SYS=$(python3 -c "import ansible_collections, os; print(os.path.dirname(list(ansible_collections.__path__)[0]))")
          ANSIBLE_COLLECTIONS_PATH="$HOME/.ansible/collections:$SYS" ~/.local/bin/ansible-lint .

      # pytest kommt aus dem Debian-Paket des Runners, kein Download
      - name: Unit Tests (tools)
        # Tests brauchen keine Secrets: Vault-Variablen des Runners entfernen
        run: env -u VAULT_ADDR -u VAULT_ROLE_ID -u VAULT_SECRET_ID python3 -m pytest -p no:cacheprovider tools -q

      - name: Trivy FS Scan (Security)
        # Feste Version statt @master. Kein actions/cache: der Runner ist
        # self-hosted, die DB bleibt in seinem Home liegen. Der Cache-Upload
        # der 130-MB-DB zu GitHub blieb am langsamen Upload haengen.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'false'
          cache-dir: '/home/github-runner/.cache/trivy'
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # STUFE 2: TERRAFORM DEPLOYMENT
  terraform-deploy:
    needs: qa-checks
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lade Runner Systemvariablen in GitHub ENV
        run: |
          echo "::add-mask::$VAULT_ROLE_ID"
          echo "::add-mask::$VAULT_SECRET_ID"
          echo "VAULT_ADDR=$VAULT_ADDR" >> $GITHUB_ENV
          echo "VAULT_ROLE_ID=$VAULT_ROLE_ID" >> $GITHUB_ENV
          echo "VAULT_SECRET_ID=$VAULT_SECRET_ID" >> $GITHUB_ENV

      - name: Fetch Proxmox Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: approle
          roleId: ${{ env.VAULT_ROLE_ID }}
          secretId: ${{ env.VAULT_SECRET_ID }}
          exportToken: true
          secrets: |
            secret/data/proxmox proxmox_api_url | TF_VAR_proxmox_api_url ;
            secret/data/proxmox proxmox_api_token_id | TF_VAR_proxmox_api_token_id ;
            secret/data/proxmox proxmox_api_token_secret | TF_VAR_proxmox_api_token_secret ;
            secret/data/proxmox ssh_public_key | TF_VAR_ssh_public_key ;
            secret/data/scaleway ACCESS_KEY | AWS_ACCESS_KEY_ID ;
            secret/data/scaleway SECRET_KEY | AWS_SECRET_ACCESS_KEY ;

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -upgrade

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: ./terraform
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        working-directory: ./terraform
        run: terraform apply -auto-approve

  # STUFE 3: ANSIBLE CONFIGURATION
  ansible-deploy:
    needs: terraform-deploy
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ansible-Umgebung und Secrets
        uses: ./.github/actions/ansible-env

      - name: Ansible Check / Dry-Run
        if: github.event_name == 'pull_request'
        working-directory: ./ansible
        run: ansible-playbook -i proxmox.yml site.yml --private-key /tmp/ansible_vault_key --check

      - name: Ansible Deploy (Main Branch Only)
        if: github.event_name == 'push'
        working-directory: ./ansible
        run: ansible-playbook -i proxmox.yml site.yml --private-key /tmp/ansible_vault_key

      # Netztrennung (firewall/policy.yml) ueber die Proxmox-API:
      # im PR nur anzeigen, auf main anwenden
      - name: Firewall pro Gast (Trockenlauf)
        if: github.event_name == 'pull_request'
        run: python3 tools/firewall/pve_firewall.py

      - name: Firewall pro Gast anwenden
        if: github.event_name == 'push'
        run: python3 tools/firewall/pve_firewall.py --apply

      # Gruen heisst hier: jeder Dienst laeuft, mit Soll-Image, und antwortet.
      - name: Verify (Dienste nach dem Deploy pruefen)
        if: github.event_name == 'push'
        working-directory: ./ansible
        run: ansible-playbook -i proxmox.yml verify.yml --private-key /tmp/ansible_vault_key

      - name: Cleanup SSH Key
        if: always()
        run: rm -f /tmp/ansible_vault_key

  # STUFE 4: ALARM - jeder rote Deploy auf main schickt eine Mail. GitHubs
  # eigene Fehler-Mail ginge bei Renovate-Automerges an den Bot, nicht an uns.
  # Liest nur /home/github-runner/.alert-smtp, kein Vault: funktioniert auch versiegelt.
  notify-failure:
    needs: [qa-checks, terraform-deploy, ansible-deploy]
    if: failure() && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mail senden
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "Der Deploy auf main ist fehlgeschlagen."
            echo
            echo "Commit: ${SHA:0:7}"
            echo "$COMMIT_MSG" | head -n 1
            echo
            echo "Lauf: $RUN_URL"
          } > /tmp/deploy-rot.txt
          python3 tools/notify/send_mail.py --subject "Deploy rot: ${SHA:0:7}" --body-file /tmp/deploy-rot.txt
