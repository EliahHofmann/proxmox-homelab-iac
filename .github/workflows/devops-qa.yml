name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:


  # STUFE 1: QA & SECURITY CHECKS
  qa-checks:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Terraform Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./terraform

      - name: Install & Run Ansible Lint
        working-directory: ./ansible
        run: |
          pipx install ansible-lint
          ~/.local/bin/ansible-lint .

      - name: Trivy FS Scan (Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # STUFE 2: TERRAFORM DEPLOYMENT
  terraform-deploy:
    needs: qa-checks          
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lade Runner Systemvariablen in GitHub ENV
        run: |
          echo "VAULT_ADDR=$VAULT_ADDR" >> $GITHUB_ENV
          echo "VAULT_ROLE_ID=$VAULT_ROLE_ID" >> $GITHUB_ENV
          echo "VAULT_SECRET_ID=$VAULT_SECRET_ID" >> $GITHUB_ENV

      - name: Fetch Proxmox Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: approle
          roleId: ${{ env.VAULT_ROLE_ID }}
          secretId: ${{ env.VAULT_SECRET_ID }}
          exportToken: true
          secrets: |
            secret/data/proxmox proxmox_api_url | TF_VAR_proxmox_api_url ;
            secret/data/proxmox proxmox_api_token_id | TF_VAR_proxmox_api_token_id ;
            secret/data/proxmox proxmox_api_token_secret | TF_VAR_proxmox_api_token_secret ;
            secret/data/proxmox ssh_public_key | TF_VAR_ssh_public_key ;
            secret/data/scaleway ACCESS_KEY | AWS_ACCESS_KEY_ID ;
            secret/data/scaleway SECRET_KEY | AWS_SECRET_ACCESS_KEY ;

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -upgrade

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: ./terraform
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        working-directory: ./terraform
        run: terraform apply -auto-approve

  # STUFE 3: ANSIBLE CONFIGURATION
  ansible-deploy:
    needs: terraform-deploy
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upgrade Ansible
        run: pip3 install --upgrade ansible-core --break-system-packages

      - name: Install Ansible Proxmox Collection
        run: ansible-galaxy collection install community.proxmox

      - name: Lade Runner Systemvariablen in GitHub ENV
        run: |
          echo "VAULT_ADDR=$VAULT_ADDR" >> $GITHUB_ENV
          echo "VAULT_ROLE_ID=$VAULT_ROLE_ID" >> $GITHUB_ENV
          echo "VAULT_SECRET_ID=$VAULT_SECRET_ID" >> $GITHUB_ENV

      - name: Fetch Core Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: approle
          roleId: ${{ env.VAULT_ROLE_ID }}
          secretId: ${{ env.VAULT_SECRET_ID }}
          exportToken: true
          secrets: |
            secret/data/proxmox proxmox_api_url | PROXMOX_URL ;
            secret/data/proxmox proxmox_api_token_id | PROXMOX_TOKEN_ID ;
            secret/data/proxmox proxmox_api_token_secret | PROXMOX_TOKEN_SECRET ;
            secret/data/ssh private_key | ANSIBLE_SSH_KEY_B64

      - name: Set Proxmox Auth for Ansible Inventory
        run: |
          FULL_TOKEN="$PROXMOX_TOKEN_ID"
          echo "PROXMOX_USER=${FULL_TOKEN%%!*}" >> $GITHUB_ENV
          echo "PROXMOX_TOKEN_ID=${FULL_TOKEN##*!}" >> $GITHUB_ENV
          echo "PROXMOX_URL=${PROXMOX_URL%/api2/json}" >> $GITHUB_ENV

      - name: Prepare SSH Key & Fetch Service Secrets
        run: |
          #SSH Key entschlüsseln und ablegen
          echo "$ANSIBLE_SSH_KEY_B64" | base64 -d > /tmp/ansible_vault_key
          chmod 600 /tmp/ansible_vault_key

          #Service Environment Variables laden
          SERVICES=("adguard" "affine" "cloudflared" "collabora" "immich" "monitoring" "nextcloud" "paperless" "traefik" "vaultwarden")
          for SERVICE in "${SERVICES[@]}"; do
            SECRET_JSON=$(curl -s --header "X-Vault-Token: ${{ env.VAULT_TOKEN }}" ${{ env.VAULT_ADDR }}/v1/secret/data/$SERVICE)
            if [ "$(echo "$SECRET_JSON" | jq -r '.data')" != "null" ]; then
              echo "$SECRET_JSON" | jq -r '.data.data | to_entries | .[] | "\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV
            fi
          done

      - name: Ansible Check / Dry-Run
        if: github.event_name == 'pull_request'
        working-directory: ./ansible
        run: ansible-playbook -i proxmox.yml site.yml --private-key /tmp/ansible_vault_key --check

      - name: Ansible Deploy (Main Branch Only)
        if: github.event_name == 'push'
        working-directory: ./ansible
        run: ansible-playbook -i proxmox.yml site.yml --private-key /tmp/ansible_vault_key

      - name: Cleanup SSH Key
        if: always()
        run: rm -f /tmp/ansible_vault_key