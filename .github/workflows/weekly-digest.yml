name: Wochen-Digest

# Montags eine Mail mit allem, was auf einen Menschen wartet: Neustarts,
# nicht automatische Updates (Docker, Vault), Proxmox-Nodes, Nextcloud.
on:
  schedule:
    - cron: "0 6 * * 1"   # Montag 06:00 UTC = 07:00/08:00 in Berlin
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    # Nur Code von main laeuft mit den Vault-Zugangsdaten
    if: github.repository == 'EliahHofmann/proxmox-homelab-iac' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ansible-Umgebung und Secrets
        uses: ./.github/actions/ansible-env

      - name: Digest sammeln
        working-directory: ./ansible
        run: ansible-playbook -i proxmox.yml digest.yml --private-key /tmp/ansible_vault_key

      # Inhalt nur per Mail, nicht ins (oeffentliche) Log
      - name: Digest mailen
        run: python3 tools/notify/send_mail.py --subject "Wochen-Digest" --body-file /tmp/homelab-digest.txt

      - name: Aufraeumen
        if: always()
        run: rm -f /tmp/ansible_vault_key /tmp/homelab-digest.txt
