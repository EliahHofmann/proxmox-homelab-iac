plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
want_proxmox_nodes_ansible_host: false

keyed_groups:
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"

compose:
  ansible_host: "(proxmox_net0.ip if (proxmox_net0 is defined and 'ip' in proxmox_net0) else (proxmox_ipconfig0.ip if (proxmox_ipconfig0 is defined and 'ip' in proxmox_ipconfig0) else inventory_hostname)) | regex_replace('/.*', '')"
  ansible_user: "'root'"