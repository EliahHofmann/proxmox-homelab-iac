plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
want_proxmox_nodes_ansible_host: false

keyed_groups:
  - key: tags_parsed
    prefix: tag
    separator: "_"

compose:
  ansible_host: >-
    {{ proxmox_net0.ip | default(proxmox_ipconfig0.ip | default(inventory_hostname)) | regex_replace('/\d+$', '') }}
  ansible_user: "'root'"