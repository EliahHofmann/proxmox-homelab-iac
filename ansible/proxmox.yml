plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
want_proxmox_nodes_ansible_host: false

keyed_groups:
  - key: tags_parsed
    prefix: tag
    separator: "_"

compose:
  ansible_host: "{{ (proxmox_net0 | default(proxmox_ipconfig0, true) | default('ip=' + inventory_hostname)).split('ip=')[1].split('/')[0].split(',')[0] }}"
  ansible_user: "'root'"