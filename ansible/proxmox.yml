plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
want_proxmox_nodes_ansible_host: false

keyed_groups:
  - key: tags_parsed
    prefix: tag
    separator: "_"

compose:
  ansible_host: >-
    {% if proxmox_net0 is defined and proxmox_net0.ip is defined %}{{ proxmox_net0.ip.split('/')[0] }}{% elif proxmox_ipconfig0 is defined and proxmox_ipconfig0.ip is defined %}{{ proxmox_ipconfig0.ip.split('/')[0] }}{% else %}{{ inventory_hostname }}{% endif %}
  ansible_user: "'root'"