---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Container pruefen
  include_role:
    name: container_health
  vars:
    container_health_dir: "{{ adguard_install_path }}"

- name: AdGuard loest Namen auf
  command: docker exec adguard nslookup example.org 127.0.0.1
  changed_when: false
  check_mode: false
