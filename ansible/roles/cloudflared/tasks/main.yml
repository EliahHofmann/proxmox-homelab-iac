---
- name: Cloudflared Verzeichnis erstellen
  file:
    path: "{{ cloudflared_install_path }}"
    state: directory
    mode: '0755'

- name: Cloudflared docker-compose.yml erstellen
  template:
    src: docker-compose.yml.j2
    dest: "{{ cloudflared_install_path }}/docker-compose.yml"

# Neue Images nur gedrosselt laden; compose up zieht danach nichts mehr
- name: Neue Images gedrosselt laden
  include_role:
    name: throttled_pull
  vars:
    throttled_pull_dir: "{{ cloudflared_install_path }}"

- name: Cloudflare Tunnel starten
  command: docker compose up -d --pull never
  args:
    chdir: "{{ cloudflared_install_path }}"