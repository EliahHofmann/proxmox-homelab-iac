---
- name: Erstelle den Ordner für Collabora
  ansible.builtin.file:
    path: "{{ collabora_install_path }}"
    state: directory
    mode: "0755"

- name: Docker-compose.yml erstellen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ collabora_install_path }}/docker-compose.yml"
    mode: "0644"

# Neue Images nur gedrosselt laden; compose up zieht danach nichts mehr
- name: Neue Images gedrosselt laden
  ansible.builtin.include_role:
    name: throttled_pull
  vars:
    throttled_pull_dir: "{{ collabora_install_path }}"

- name: Container starten
  ansible.builtin.command: docker compose up -d --pull never
  args:
    chdir: "{{ collabora_install_path }}"
