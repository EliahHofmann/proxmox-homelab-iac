---
- name: NOTFALL-FIX - Alte fehlerhafte .sources Datei entfernen
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.sources
    state: absent

- name: Zeitzone auf Europa/Berlin setzen
  community.general.timezone:
    name: Europe/Berlin

# Muss vor dem ersten apt-Aufruf liegen, sonst laedt der Lauf ungebremst.
# Queue-Mode access: eine Verbindung statt einer pro Server, sonst gilt
# das Limit pro Verbindung und die Summe liegt hoeher.
- name: Apt-Downloads auf 300 KB/s drosseln
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/75-dl-limit
    content: |
      // Download-Drossel 300 KB/s, verwaltet von Ansible (common)
      Acquire::http::Dl-Limit "300";
      Acquire::https::Dl-Limit "300";
      Acquire::Queue-Mode "access";
    owner: root
    group: root
    mode: "0644"

# Paket-Zwischenspeicher (apt_cache auf der Monitoring-VM): apt fragt ihn nur,
# wenn er erreichbar ist - sonst direkt ins Internet wie bisher
- name: Erkennung des Paket-Zwischenspeichers bereitstellen
  ansible.builtin.copy:
    src: apt-proxy-detect
    dest: /usr/local/bin/apt-proxy-detect
    owner: root
    group: root
    mode: "0755"

- name: Apt nutzt den Paket-Zwischenspeicher, wenn erreichbar
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/02homelab-proxy
    content: |
      // Verwaltet von Ansible (common)
      Acquire::http::Proxy-Auto-Detect "/usr/local/bin/apt-proxy-detect";
    owner: root
    group: root
    mode: "0644"

- name: Voraussetzungen für das moderne Docker-Setup installieren
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 86400

# große Hilfe von Reddit: https://www.reddit.com/r/ansible/comments/163x5iy/installing_docker_on_debian_12/

- name: Alte Docker-Repository-Dateien und veraltete Einträge bereinigen
  block:
    # docker.list bleibt stehen: der Copy-Task unten setzt ihren Inhalt.
    # Frueher wurde sie hier jedes Mal geloescht und samt apt-Listen neu
    # geladen - bei naechtlichen Deploys unnoetiger Download.
    - name: Remove all old Docker lines from any sources file
      ansible.builtin.shell: find /etc/apt \( -name "*.list" -o -name "*.sources" \) ! -path /etc/apt/sources.list.d/docker.list | xargs sed -i
        '/download\.docker\.com/d' || true
      changed_when: false
    - name: Remove old Docker repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/sources.list.d/docker

- name: Prüfen, ob der Docker-Schlüssel bereits existiert
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_gpg

- name: APT-Keyring-Verzeichnis erstellen
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Docker GPG-Schlüssel (.asc) herunterladen
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: not docker_gpg.stat.exists

- name: Berechtigungen für den Docker-Schlüssel setzen
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    mode: "0644"
    owner: root
    group: root
  when: not docker_gpg.stat.exists

- name: Alte fehlerhafte .sources Datei entfernen
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.sources
    state: absent

- name: Docker APT-Repository hinzufügen (klassisches .list Format)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release
      }} stable\n"
    mode: "0644"
  register: docker_repo

- name: Installiere Docker, Compose und Basis
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    # Neues Repo -> Listen sofort neu laden, sonst reicht einmal am Tag
    cache_valid_time: "{{ 0 if docker_repo.changed else 86400 }}"

- name: Prüfen, ob das Loki Docker Plugin bereits installiert ist
  ansible.builtin.command: docker plugin ls
  register: docker_plugins
  changed_when: false

- name: Loki Docker Plugin installieren
  ansible.builtin.command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
  when: "'loki' not in docker_plugins.stdout"

- name: Loki-Passwort aus Vault vorhanden
  ansible.builtin.assert:
    that:
      - loki_push_password is match('^[A-Za-z0-9]{20,}$')
    fail_msg: "LOKI_PUSH_PASSWORD fehlt, ist zu kurz oder enthaelt Sonderzeichen (Vault secret/monitoring)"
    quiet: true

# Das Loki-Plugin sieht keine Host-Dateien, nur sein eigenes Dateisystem.
# Die Homelab-CA muss deshalb dort liegen; nach einem Plugin-Update (neue ID)
# legt dieser Schritt sie wieder ab.
- name: ID des Loki-Plugins ermitteln
  ansible.builtin.command: docker plugin inspect loki -f '{{ '{{' }}.Id{{ '}}' }}'
  register: loki_plugin_id
  changed_when: false
  check_mode: false
  # Ohne gueltige Plugin-ID keine CA im Plugin -> lieber abbrechen als
  # eine https-URL mit Passwort ohne pruefbare CA ausrollen
  failed_when: loki_plugin_id.rc != 0 or loki_plugin_id.stdout is not match('^[0-9a-f]{64}$')

- name: Homelab-CA ins Loki-Plugin legen
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/vault-ca.pem"
    dest: "/var/lib/docker/plugins/{{ loki_plugin_id.stdout }}/rootfs/etc/homelab-ca.pem"
    owner: root
    group: root
    mode: "0644"
  register: loki_plugin_ca

# Enthaelt das Loki-Passwort -> nur root, nie im Log
- name: Docker daemon.json für globales Loki-Logging erstellen
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0600"
    content: |
      {
        "log-driver": "loki",
        "log-opts": {
          "loki-url": "https://{{ loki_push_user }}:{{ loki_push_password }}@{{ loki_push_host }}/loki/api/v1/push",
          "loki-tls-ca-file": "/etc/homelab-ca.pem",
          "loki-retries": "5",
          "loki-batch-size": "400"
        }
      }
  register: docker_daemon_config
  no_log: true

- name: Docker Dienst neu starten
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_daemon_config.changed

# Laufende Container behalten ihr altes Log-Ziel bis zur Neuerstellung
- name: Umstell-Skript fuer das Loki-Ziel bereitstellen
  ansible.builtin.copy:
    src: loki-umstellen.sh
    dest: /usr/local/sbin/loki-umstellen
    owner: root
    group: root
    mode: "0750"

- name: Container mit altem Loki-Ziel neu erstellen
  ansible.builtin.command: /usr/local/sbin/loki-umstellen
  register: loki_umstellen
  changed_when: "'neu erstellt' in loki_umstellen.stdout"
  when: not ansible_check_mode

# OS-Updates laufen nur noch ueber unattended-upgrades (nur Debian-Security,
# kein Auto-Reboot). Frueher machte jeder Deploy dist-upgrade + Reboot - mit
# naechtlichen Auto-Deploys haette das z.B. Vault neu gestartet (= versiegelt,
# danach scheitert jeder Deploy).
- name: Unattended-upgrades installieren
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Unattended-upgrades konfigurieren
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 20auto-upgrades
    - 52unattended-upgrades-local

- name: Unattended-upgrades aktivieren
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  # Im --check wird das Paket nicht installiert, der Dienst fehlt dann noch
  ignore_errors: "{{ ansible_check_mode }}"

- name: Installierte Pakete ermitteln
  ansible.builtin.package_facts:

# Ein Vault-Upgrade startet den Dienst neu -> versiegelt -> kein Deploy mehr.
# Debian-Security fasst das HashiCorp-Repo zwar nicht an; der Hold sichert
# auch gegen ein versehentliches apt upgrade.
- name: Vault-Paket festhalten
  ansible.builtin.dpkg_selections:
    name: vault
    selection: hold
  when: "'vault' in ansible_facts.packages"
