---
- name: NOTFALL-FIX - Alte fehlerhafte .sources Datei entfernen
  file:
    path: /etc/apt/sources.list.d/docker.sources
    state: absent

- name: Zeitzone auf Europa/Berlin setzen
  timezone:
    name: Europe/Berlin

# Muss vor dem ersten apt-Aufruf liegen, sonst laedt der Lauf ungebremst.
# Queue-Mode access: eine Verbindung statt einer pro Server, sonst gilt
# das Limit pro Verbindung und die Summe liegt hoeher.
- name: apt-Downloads auf 300 KB/s drosseln
  copy:
    dest: /etc/apt/apt.conf.d/75-dl-limit
    content: |
      // Download-Drossel 300 KB/s, verwaltet von Ansible (common)
      Acquire::http::Dl-Limit "300";
      Acquire::https::Dl-Limit "300";
      Acquire::Queue-Mode "access";
    owner: root
    group: root
    mode: '0644'

- name: Voraussetzungen für das moderne Docker-Setup installieren
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
    cache_valid_time: 86400

#große Hilfe von Reddit: https://www.reddit.com/r/ansible/comments/163x5iy/installing_docker_on_debian_12/

- name: Alte Docker-Repository-Dateien und veraltete Einträge bereinigen
  block:
    # docker.list bleibt stehen: der Copy-Task unten setzt ihren Inhalt.
    # Frueher wurde sie hier jedes Mal geloescht und samt apt-Listen neu
    # geladen - bei naechtlichen Deploys unnoetiger Download.
    - name: Remove all old Docker lines from any sources file
      shell: find /etc/apt \( -name "*.list" -o -name "*.sources" \) ! -path /etc/apt/sources.list.d/docker.list | xargs sed -i '/download\.docker\.com/d' || true
      changed_when: false
    - name: Remove old Docker repo files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/sources.list.d/docker

- name: Prüfen, ob der Docker-Schlüssel bereits existiert
  stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_gpg

- name: APT-Keyring-Verzeichnis erstellen
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Docker GPG-Schlüssel (.asc) herunterladen
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not docker_gpg.stat.exists

- name: Berechtigungen für den Docker-Schlüssel setzen
  file:
    path: /etc/apt/keyrings/docker.asc
    mode: '0644'
    owner: root
    group: root
  when: not docker_gpg.stat.exists

- name: Alte fehlerhafte .sources Datei entfernen
  file:
    path: /etc/apt/sources.list.d/docker.sources
    state: absent

- name: Docker APT-Repository hinzufügen (klassisches .list Format)
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable\n"
    mode: '0644'
  register: docker_repo

- name: Installiere Docker, Compose und Basis
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
    # Neues Repo -> Listen sofort neu laden, sonst reicht einmal am Tag
    cache_valid_time: "{{ 0 if docker_repo.changed else 86400 }}"

- name: Prüfen, ob das Loki Docker Plugin bereits installiert ist
  command: docker plugin ls
  register: docker_plugins
  changed_when: false

- name: Loki Docker Plugin installieren
  command: docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
  when: "'loki' not in docker_plugins.stdout"

- name: Docker daemon.json für globales Loki-Logging erstellen
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "loki",
        "log-opts": {
          "loki-url": "http://192.168.178.60:3100/loki/api/v1/push",
          "loki-retries": "5",
          "loki-batch-size": "400"
        }
      }
  register: docker_daemon_config

- name: Docker Dienst neu starten
  service:
    name: docker
    state: restarted
  when: docker_daemon_config.changed

# OS-Updates laufen nur noch ueber unattended-upgrades (nur Debian-Security,
# kein Auto-Reboot). Frueher machte jeder Deploy dist-upgrade + Reboot - mit
# naechtlichen Auto-Deploys haette das z.B. Vault neu gestartet (= versiegelt,
# danach scheitert jeder Deploy).
- name: unattended-upgrades installieren
  apt:
    name: unattended-upgrades
    state: present

- name: unattended-upgrades konfigurieren
  template:
    src: "{{ item }}.j2"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - 20auto-upgrades
    - 52unattended-upgrades-local

- name: unattended-upgrades aktivieren
  service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Installierte Pakete ermitteln
  package_facts:

# Ein Vault-Upgrade startet den Dienst neu -> versiegelt -> kein Deploy mehr.
# Debian-Security fasst das HashiCorp-Repo zwar nicht an; der Hold sichert
# auch gegen ein versehentliches apt upgrade.
- name: Vault-Paket festhalten
  dpkg_selections:
    name: vault
    selection: hold
  when: "'vault' in ansible_facts.packages"
