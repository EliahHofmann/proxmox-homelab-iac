---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Fehlgeschlagene Systemdienste lesen
  ansible.builtin.command: systemctl --failed --no-legend --plain
  register: common_failed_units
  changed_when: false
  check_mode: false

- name: Kein Systemdienst ist fehlgeschlagen
  ansible.builtin.assert:
    that: common_failed_units.stdout | trim | length == 0
    fail_msg: "Fehlgeschlagene Dienste: {{ common_failed_units.stdout_lines | map('split') | map('first') | join(', ') }}"
    quiet: true
