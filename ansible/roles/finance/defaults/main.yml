---
finance_install_path: "/opt/finance-stack"
finance_firefly_data: "/opt/finance-stack/firefly-upload"
finance_db_data: "/opt/finance-stack/db"
# Monitoring: gemeinsame Prometheus-State-Dateien der Cron-Jobs (Host-Pfad).
finance_metrics_state: "/opt/finance-stack/metrics-state"

# Domain
finance_subdomain: "finanzen"
ntfy_subdomain: "ntfy"
finance_domain: "{{ lookup('env', 'DOMAIN_NAME') }}"

# Secrets (Vault -> env)
finance_db_password: "{{ lookup('env', 'FINANCE_DB_PASSWORD') }}"
firefly_app_key: "{{ lookup('env', 'FIREFLY_APP_KEY') }}"
firefly_pat: "{{ lookup('env', 'FIREFLY_PAT') }}"
finance_paperless_token: "{{ lookup('env', 'FINANCE_PAPERLESS_TOKEN') }}"
enable_banking_app_id: "{{ lookup('env', 'ENABLE_BANKING_APP_ID') }}"
# PEM ist mehrzeilig -> in Vault base64-kodiert (einzeilig) ablegen,
# sonst zerlegt es die Vault->Env-Schleife der Pipeline.
enable_banking_private_key_b64: "{{ lookup('env', 'ENABLE_BANKING_PRIVATE_KEY_B64') }}"
importer_autoimport_secret: "{{ lookup('env', 'IMPORTER_AUTOIMPORT_SECRET') }}"
ntfy_token: "{{ lookup('env', 'NTFY_TOKEN') | default('', true) }}"
# ntfy ist von aussen erreichbar (Traefik) -> Zugriff nur mit Anmeldung.
# publisher schreibt (Webhook/Berater), der Lese-Benutzer ist fuer die App.
ntfy_publisher_password: "{{ lookup('env', 'NTFY_PUBLISHER_PASSWORD') | default('', true) }}"
ntfy_reader_user: "{{ lookup('env', 'NTFY_READER_USER') | default('eliah', true) }}"
ntfy_reader_password: "{{ lookup('env', 'NTFY_READER_PASSWORD') | default('', true) }}"
# Salt fuer merchant_hash in Logs (kein hartes Secret; verhindert nur, dass der
# gekuerzte Hash trivial rueckrechenbar ist). Default reicht, kann via Vault ueberschrieben werden.
finance_log_salt: "{{ lookup('env', 'FINANCE_LOG_SALT') | default('finance-homelab', true) }}"

# PEM im Container; auf dem Host unter {{ finance_install_path }}/secrets/
enable_banking_key_path: "/secrets/enable_banking.pem"
# Setzt die Sparkasse einen PSU-IP-Header voraus, hier auf true stellen und
# finance_public_ip fuellen (autodetect wuerde icanhazip.com kontaktieren).
enable_banking_ip_header: "false"

# Interne Adressen
finance_host_ip: "192.168.178.87"
finance_paperless_url: "http://192.168.178.86:8010"
finance_ollama_url: "http://192.168.178.85:11434/api/generate"
# Extraktion: MoE-Modell, nur rund 3B Parameter je Token aktiv - auf der
# CPU des Hosts damit so schnell wie ein kleines Modell, aber deutlich
# treffsicherer bei mehrteiligen Belegen.
finance_ollama_model: "qwen3.6-14b-a3b"
# Berater: bewusst ein ANDERES Modell. Das Extraktionsmodell ist auf
# englischen Daten nachtrainiert und antwortet bei freiem Fliesstext
# englisch, verstuemmelt deutsche JSON-Schluessel und rechnet eigenmaechtig.
finance_ollama_model_advisor: "qwen3:latest"
finance_ntfy_url: "http://ntfy:80/finanzen"
