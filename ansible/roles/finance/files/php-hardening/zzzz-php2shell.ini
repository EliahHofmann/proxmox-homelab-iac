; Uebergangs-Workaround fuer PHP2Shell (CVE-2026-109618/-109619, BSI
; 2026-297981-1132), bis Firefly ein Image mit PHP >= 8.5.12 liefert.
; Verringert die Angriffsflaeche nur, schliesst die Luecke NICHT.
; Danach Datei und Mounts wieder entfernen.

; CVE-2026-109619: Angriffspfad ueber Sessions und Backtraces
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

; CVE-2026-109618: kein vom Angreifer erreichbares Speicherlimit;
; die Grenze setzt stattdessen mem_limit des Containers
memory_limit = -1
post_max_size = 32M
upload_max_filesize = 30M
