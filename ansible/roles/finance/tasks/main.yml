---
- name: finance-stack Gruppe erstellen
  group:
    name: finance-stack
    system: yes
    state: present

- name: finance-stack Benutzer erstellen
  user:
    name: finance-stack
    group: finance-stack
    system: yes
    shell: /bin/bash
    create_home: yes

- name: finance-stack Ordnerstruktur erstellen
  file:
    path: "{{ item }}"
    state: directory
    owner: finance-stack
    group: finance-stack
    mode: '0755'
  loop:
    - "{{ finance_install_path }}"
    - "{{ finance_firefly_data }}"
    - "{{ finance_db_data }}"
    - "{{ finance_install_path }}/import"
    - "{{ finance_install_path }}/ntfy"

- name: Webhook Source-Code kopieren
  copy:
    src: webhook-src
    dest: "{{ finance_install_path }}/"
    owner: finance-stack
    group: finance-stack
    mode: '0644'

- name: Docker Compose generieren
  template:
    src: docker-compose.yml.j2
    dest: "{{ finance_install_path }}/docker-compose.yml"
    owner: finance-stack
    group: finance-stack
    mode: '0640'

- name: Docker Compose starten
  command: docker compose up -d --build
  args:
    chdir: "{{ finance_install_path }}"

- name: Autoimport curl-config bereitstellen (Secret, 0600)
  template:
    src: import.curlcfg.j2
    dest: "{{ finance_install_path }}/import.curlcfg"
    owner: finance-stack
    group: finance-stack
    mode: '0600'
  no_log: true

- name: GoCardless-Import Wrapper-Skript bereitstellen
  template:
    src: gocardless-import.sh.j2
    dest: "{{ finance_install_path }}/gocardless-import.sh"
    owner: finance-stack
    group: finance-stack
    mode: '0750'

- name: Taeglicher GoCardless-Autoimport (Sparkasse)
  cron:
    name: "firefly-gocardless-import"
    hour: "6"
    minute: "30"
    job: "{{ finance_install_path }}/gocardless-import.sh"

- name: Dedup-Matching nach Bank-Import
  cron:
    name: "firefly-matching-job"
    hour: "7"
    minute: "0"
    job: "docker exec finance-webhook python /app/matching_job.py"

- name: Monatlicher KI-Finanzbericht
  cron:
    name: "firefly-advisor"
    day: "1"
    hour: "8"
    minute: "0"
    job: "docker exec finance-webhook python /app/advisor.py"
