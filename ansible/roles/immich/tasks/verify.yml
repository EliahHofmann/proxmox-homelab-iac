---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Container pruefen
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_dir: "{{ immich_install_path }}"

- name: Immich antwortet mit Version
  ansible.builtin.uri:
    url: http://localhost:2283/api/server/version
