---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Container pruefen
  include_role:
    name: container_health
  vars:
    container_health_dir: "{{ jellyfin_install_path }}"

- name: Jellyfin antwortet mit Version
  uri:
    url: http://localhost:8096/System/Info/Public
    return_content: true
  register: jellyfin_info
  failed_when: jellyfin_info.status != 200 or 'Version' not in jellyfin_info.json
