---
# Beide Proxmox-Knoten werden vom pve-exporter abgefragt
proxmox_node_ips: ['192.168.178.10', '192.168.178.11']
# Gestoppte Test-/Spiel-Gaeste: nicht scrapen, nicht alarmieren
monitoring_excluded_hosts: ['Kali-Linux-Prax', 'Sandbox', 'Minecraft']
monitoring_install_path: '/opt/monitoring'
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
grafana_port: '3000'
loki_port: '3100'
prometheus_port: '9090'
proxmox_api_token: "{{ lookup('env', 'PROXMOX_API_TOKEN') }}"