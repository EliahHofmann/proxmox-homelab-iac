---
- name: Konfliktvermeidung - alten nativen Node-Exporter restlos deinstallieren
  apt:
    name: prometheus-node-exporter
    state: absent
    purge: yes
    autoremove: yes
  become: yes
  ignore_errors: yes
  
- name: Monitoring Hauptordner erstellen
  file:
    path: "{{ monitoring_install_path }}"
    state: directory
    mode: '0755'

- name: Daten-Ordner mit korrekten Rechten für Container-Nutzer erstellen
  file:
    path: "{{ monitoring_install_path }}/{{ item.dir }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.uid }}"
    mode: '0755'
  loop:
    - { dir: 'grafana-data', uid: '472' }
    - { dir: 'loki-data', uid: '10001' }
    - { dir: 'prometheus-data', uid: '65534' }

- name: Prometheus Konfiguration generieren
  template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_install_path }}/prometheus.yml"
  register: prometheus_config

- name: Proxmox Exporter Konfiguration (API Token) generieren
  template:
    src: pve.yml.j2
    dest: "{{ monitoring_install_path }}/pve.yml"

- name: Grafana-Provisioning + Dashboards (Datasources, Finance-Dashboard) bereitstellen
  copy:
    src: grafana/
    dest: "{{ monitoring_install_path }}/grafana/"
    mode: '0644'

- name: Monitoring docker-compose.yml generieren
  template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_install_path }}/docker-compose.yml"

- name: Monitoring Stack (Grafana, Loki, Prometheus, Node-Exporter) starten
  command: docker compose up -d
  args:
    chdir: "{{ monitoring_install_path }}"

# Bei reiner Config-Aenderung wird der Prometheus-Container von "up -d" NICHT neu
# erstellt. Ein SIGHUP-Reload reicht NICHT: Ansibles template schreibt die Datei
# atomar (neuer Inode), der laufende Container haengt aber am alten Inode und wuerde
# die alte Config neu laden. Daher den Container neu starten -> re-bindet den
# aktuellen Host-Inode UND laedt die Config neu. Nur wenn sich die Config aenderte.
- name: Prometheus neu starten, wenn sich die Scrape-Config geaendert hat
  command: docker restart prometheus
  when: prometheus_config is changed