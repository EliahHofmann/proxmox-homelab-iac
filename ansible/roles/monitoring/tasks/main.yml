---
- name: Konfliktvermeidung - alten nativen Node-Exporter restlos deinstallieren
  apt:
    name: prometheus-node-exporter
    state: absent
    purge: yes
    autoremove: yes
  become: yes
  ignore_errors: yes
  
- name: Monitoring Hauptordner erstellen
  file:
    path: "{{ monitoring_install_path }}"
    state: directory
    mode: '0755'

- name: Daten-Ordner mit korrekten Rechten für Container-Nutzer erstellen
  file:
    path: "{{ monitoring_install_path }}/{{ item.dir }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.uid }}"
    mode: '0755'
  loop:
    - { dir: 'grafana-data', uid: '472' }
    - { dir: 'loki-data', uid: '10001' }
    - { dir: 'prometheus-data', uid: '65534' }
    - { dir: 'rules', uid: '65534' }

- name: Prometheus Konfiguration generieren
  template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_install_path }}/prometheus.yml"
  register: prometheus_config

- name: Proxmox Exporter Konfiguration (API Token) generieren
  template:
    src: pve.yml.j2
    dest: "{{ monitoring_install_path }}/pve.yml"
  register: pve_config

- name: Grafana-Provisioning + Dashboards (Datasources, Finance-Dashboard) bereitstellen
  copy:
    src: grafana/
    dest: "{{ monitoring_install_path }}/grafana/"
    mode: '0644'

- name: Monitoring docker-compose.yml generieren
  template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_install_path }}/docker-compose.yml"

# Neue Images nur gedrosselt laden; compose up zieht danach nichts mehr
- name: Neue Images gedrosselt laden
  include_role:
    name: throttled_pull
  vars:
    throttled_pull_dir: "{{ monitoring_install_path }}"

# Regeln vor dem Einsatz pruefen und testen, mit dem Prometheus-Image aus der
# compose-Datei. Laeuft auch im --check (eigener Pruefordner), damit kaputte
# Regeln schon im PR auffallen.
- name: Alarmregeln in den Pruefordner kopieren
  copy:
    src: rules/
    dest: "{{ monitoring_install_path }}/rules-check/"
    mode: '0644'
  check_mode: false

- name: Alarmregeln pruefen und testen (promtool)
  shell: |
    set -e
    img=$(grep -oE 'prom/prometheus:[^ "]+' docker-compose.yml | head -1)
    docker run --rm --log-driver none --entrypoint promtool -v {{ monitoring_install_path }}/rules-check:/r:ro "$img" check rules /r/homelab.yml
    docker run --rm --log-driver none --entrypoint promtool -v {{ monitoring_install_path }}/rules-check:/r:ro "$img" test rules /r/homelab.test.yml
  args:
    chdir: "{{ monitoring_install_path }}"
    executable: /bin/bash
  changed_when: false
  check_mode: false

- name: Alarmregeln fuer Prometheus bereitstellen
  copy:
    src: rules/homelab.yml
    dest: "{{ monitoring_install_path }}/rules/homelab.yml"
    mode: '0644'
  register: prometheus_rules

- name: Monitoring Stack (Grafana, Loki, Prometheus, Node-Exporter) starten
  command: docker compose up -d --pull never
  args:
    chdir: "{{ monitoring_install_path }}"

# Bei reiner Config-Aenderung wird der Prometheus-Container von "up -d" NICHT neu
# erstellt. Ein SIGHUP-Reload reicht NICHT: Ansibles template schreibt die Datei
# atomar (neuer Inode), der laufende Container haengt aber am alten Inode und wuerde
# die alte Config neu laden. Daher den Container neu starten -> re-bindet den
# aktuellen Host-Inode UND laedt die Config neu. Nur wenn sich die Config aenderte.
- name: Prometheus neu starten, wenn sich Scrape-Config oder Regeln geaendert haben
  command: docker restart prometheus
  when: prometheus_config is changed or prometheus_rules is changed

# Gleiches Inode-Problem: ohne Neustart liest der Exporter weiter den alten Token
- name: Proxmox-Exporter neu starten, wenn sich seine Config geaendert hat
  command: docker restart pve-exporter
  when: pve_config is changed

# GF_SECURITY_ADMIN_PASSWORD gilt nur beim ersten Start. Damit ein rotiertes
# Passwort aus Vault ankommt, wird es bei jedem Lauf gesetzt (ueber stdin).
- name: Grafana-Admin-Passwort aus Vault setzen
  command: docker exec -i grafana grafana cli admin reset-admin-password --password-from-stdin
  args:
    stdin: "{{ grafana_admin_password }}"
  changed_when: false
  no_log: true
  when: grafana_admin_password | length > 0
