---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Container pruefen
  include_role:
    name: container_health
  vars:
    container_health_dir: "{{ monitoring_install_path }}"

- name: Grafana, Prometheus, Exporter antworten
  uri:
    url: "http://localhost:{{ item }}"
  loop:
    - 3000/api/health
    - 9090/-/ready
    - 9100/metrics
    - 9221/

# Loki braucht nach dem Start eine Weile bis ready
- name: Loki ist bereit
  uri:
    url: http://localhost:3100/ready
  register: loki_ready
  until: loki_ready.status == 200
  retries: 24
  delay: 5

# Waechter: ohne Passwort keine Lieferung, Lesen von aussen gesperrt
- name: Loki-Waechter ist bereit und sperrt ohne Passwort
  uri:
    url: "http://localhost:{{ loki_gateway_port }}{{ item.pfad }}"
    method: "{{ item.methode }}"
    status_code: "{{ item.status }}"
  loop:
    - { pfad: /ready, methode: GET, status: 200 }
    - { pfad: /loki/api/v1/push, methode: POST, status: 401 }
    - { pfad: /loki/api/v1/query, methode: GET, status: 403 }
  register: loki_gw
  until: loki_gw.status == item.status
  retries: 12
  delay: 5

- name: Loki-Waechter nimmt Logs mit Passwort an
  uri:
    url: "http://localhost:{{ loki_gateway_port }}/loki/api/v1/push"
    method: POST
    url_username: "{{ loki_push_user }}"
    url_password: "{{ loki_push_password }}"
    force_basic_auth: true
    body_format: json
    body:
      streams:
        - stream: { job: verify, source: loki-gateway }
          values: [["{{ (lookup('pipe', 'date +%s') | int) * 1000000000 }}", "verify: Waechter nimmt mit Passwort an"]]
    status_code: 204
  no_log: true

# Nach einem Neustart brauchen beide ein paar Sekunden
- name: Alertmanager ist bereit
  uri:
    url: http://localhost:9093/-/ready
  register: am_ready
  until: am_ready.status == 200
  retries: 12
  delay: 5

- name: Prometheus kennt den Alertmanager
  uri:
    url: http://localhost:9090/api/v1/alertmanagers
    return_content: true
  register: prom_am
  until: prom_am.json.data.activeAlertmanagers | length >= 1
  retries: 12
  delay: 5
