---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Container pruefen
  include_role:
    name: container_health
  vars:
    container_health_dir: "{{ monitoring_install_path }}"

- name: Grafana, Prometheus, Exporter antworten
  uri:
    url: "http://localhost:{{ item }}"
  loop:
    - 3000/api/health
    - 9090/-/ready
    - 9100/metrics
    - 9221/

# Loki braucht nach dem Start eine Weile bis ready
- name: Loki ist bereit
  uri:
    url: http://localhost:3100/ready
  register: loki_ready
  until: loki_ready.status == 200
  retries: 24
  delay: 5

# Nach einem Neustart brauchen beide ein paar Sekunden
- name: Alertmanager ist bereit
  uri:
    url: http://localhost:9093/-/ready
  register: am_ready
  until: am_ready.status == 200
  retries: 12
  delay: 5

- name: Prometheus kennt den Alertmanager
  uri:
    url: http://localhost:9090/api/v1/alertmanagers
    return_content: true
  register: prom_am
  until: prom_am.json.data.activeAlertmanagers | length >= 1
  retries: 12
  delay: 5
