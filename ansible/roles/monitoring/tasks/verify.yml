---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Container pruefen
  include_role:
    name: container_health
  vars:
    container_health_dir: "{{ monitoring_install_path }}"

- name: Grafana, Prometheus, Exporter antworten
  uri:
    url: "http://localhost:{{ item }}"
  loop:
    - 3000/api/health
    - 9090/-/ready
    - 9100/metrics
    - 9221/

# Loki braucht nach dem Start eine Weile bis ready
- name: Loki ist bereit
  uri:
    url: http://localhost:3100/ready
  register: loki_ready
  until: loki_ready.status == 200
  retries: 24
  delay: 5

# Waechter: ohne Passwort keine Lieferung, Lesen von aussen gesperrt
- name: Loki-Waechter ist bereit und sperrt ohne Passwort
  uri:
    url: "https://{{ ansible_host }}:{{ loki_gateway_port }}{{ item.pfad }}"
    ca_path: "{{ monitoring_install_path }}/loki-gateway-tls/ca.pem"
    method: "{{ item.methode }}"
    status_code: "{{ item.status }}"
  loop:
    - { pfad: /ready, methode: GET, status: 200 }
    - { pfad: /loki/api/v1/push, methode: POST, status: 401 }
    - { pfad: /loki/api/v1/query, methode: GET, status: 403 }
  register: loki_gw
  until: loki_gw.status == item.status
  retries: 12
  delay: 5

# curl statt uri: Loki verlangt den Zeitstempel als String, Ansible wuerde ihn
# in eine Zahl umwandeln (-> 400). Zugangsdaten per stdin, nie in argv.
- name: Loki-Waechter nimmt Logs mit Passwort an
  shell: |
    ts="$(date +%s)000000000"
    curl -sS -o /dev/null -w '%{http_code}' -K -       --cacert {{ monitoring_install_path }}/loki-gateway-tls/ca.pem       -H 'Content-Type: application/json'       -d "{\"streams\":[{\"stream\":{\"job\":\"verify\",\"source\":\"loki-gateway\"},\"values\":[[\"$ts\",\"verify: Waechter nimmt mit Passwort an\"]]}]}"       https://{{ ansible_host }}:{{ loki_gateway_port }}/loki/api/v1/push
  args:
    executable: /bin/bash
    stdin: 'user = "{{ loki_push_user }}:{{ loki_push_password }}"'
  register: loki_gw_push
  changed_when: false
  failed_when: loki_gw_push.stdout != '204'
  no_log: true

# Nach einem Neustart brauchen beide ein paar Sekunden
- name: Alertmanager ist bereit
  uri:
    url: http://localhost:9093/-/ready
  register: am_ready
  until: am_ready.status == 200
  retries: 12
  delay: 5

- name: Prometheus kennt den Alertmanager
  uri:
    url: http://localhost:9090/api/v1/alertmanagers
    return_content: true
  register: prom_am
  until: prom_am.json.data.activeAlertmanagers | length >= 1
  retries: 12
  delay: 5
