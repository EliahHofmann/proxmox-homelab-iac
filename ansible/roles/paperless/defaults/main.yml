---
paperless_version: "latest"
paperless_install_path: "/opt/paperless-ngx"
paperless_port: 8010
PAPERLESS_DBPASS: "{{ lookup('env', 'PAPERLESS_DBPASS') }}"
MARIADB_ROOT_PASSWORD: "{{ lookup('env', 'MARIADB_ROOT_PASSWORD') }}"
PAPERLESS_SECRET_KEY: "{{ lookup('env', 'PAPERLESS_SECRET_KEY') }}"
PAPERLESS_ADMIN_USER: "{{ lookup('env', 'PAPERLESS_ADMIN_USER') }}"
PAPERLESS_ADMIN_PASSWORD: "{{ lookup('env', 'PAPERLESS_ADMIN_PASSWORD') }}"