---
- name: Paperless-ngx Gruppe erstellen
  ansible.builtin.group:
    name: paperless-ngx
    system: true
    state: present

- name: Paperless-ngx Benutzer erstellen
  ansible.builtin.user:
    name: paperless-ngx
    group: paperless-ngx
    system: true
    shell: /bin/bash
    create_home: true

- name: Paperless-ngx Ordnerstruktur erstellen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: paperless-ngx
    group: paperless-ngx
    mode: "0755"
  loop:
    - "{{ paperless_install_path }}"
    - "{{ paperless_install_path }}/scripts"
    - "{{ paperless_proton_data }}"

# Paperless runs as uid/gid 1000 inside the container and must be able to
# write these mounts (e.g. media/media.lock). The host user paperless-ngx has
# a different uid, so owning them by it breaks every consume.
- name: Paperless-ngx beschreibbare Ordner fuer den Container-User
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ paperless_install_path }}/data"
    - "{{ paperless_install_path }}/media"
    - "{{ paperless_install_path }}/export"
    - "{{ paperless_install_path }}/consume"

- name: Python Skript (ai_tagger.py) auf den Server kopieren
  ansible.builtin.copy:
    src: ai_tagger.py
    dest: "{{ paperless_install_path }}/scripts/ai_tagger.py"
    owner: paperless-ngx
    group: paperless-ngx
    mode: "0755"

- name: Proton-bridge Build-Context (Dockerfile) kopieren
  ansible.builtin.copy:
    src: proton-bridge
    dest: "{{ paperless_install_path }}/"
    owner: paperless-ngx
    group: paperless-ngx
    mode: "0644"

- name: Paperless-ngx docker-compose.yml erstellen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_install_path }}/docker-compose.yml"

# Vor compose up: sonst ist Port 1025 kurz fuer das ganze LAN offen.
- name: Allow-List fuer das Bridge-SMTP bereitstellen
  ansible.builtin.template:
    src: bridge-smtp-allowlist.service.j2
    dest: /etc/systemd/system/bridge-smtp-allowlist.service
    owner: root
    group: root
    mode: "0644"
  register: bridge_allowlist_unit

# restarted statt started, damit neue IPs aus alert_smtp_allowed greifen
- name: Allow-List fuer das Bridge-SMTP aktivieren
  ansible.builtin.systemd:
    name: bridge-smtp-allowlist
    daemon_reload: "{{ bridge_allowlist_unit.changed }}"
    enabled: true
    state: "{{ 'restarted' if bridge_allowlist_unit.changed else 'started' }}"
  # Im --check der PR-Pipeline existiert die Unit beim ersten Mal noch nicht
  ignore_errors: "{{ ansible_check_mode }}"

# Neue Images nur gedrosselt laden; compose up zieht danach nichts mehr
- name: Neue Images gedrosselt laden
  ansible.builtin.include_role:
    name: throttled_pull
  vars:
    throttled_pull_dir: "{{ paperless_install_path }}"

- name: Paperless-ngx Container starten
  ansible.builtin.command: docker compose up -d --pull never --build
  args:
    chdir: "{{ paperless_install_path }}"

# Proton-Filter greifen nicht bei Mails, die das Konto selbst verschickt -
# Alertmanager sendet aber ueber die eigene Bridge. Darum sortiert ein Timer.
- name: Fingerabdruck der Bridge fuer den Alarm-Sortierer vorhanden
  ansible.builtin.assert:
    that:
      - (paperless_alarm_fingerprint | replace(':', '') | length) == 64
    fail_msg: "SMTP_FINGERPRINT fehlt (Vault secret/alerts smtp_fingerprint)"

- name: Alarm-Sortierer (alarm_sortierer.py) auf den Server kopieren
  ansible.builtin.copy:
    src: alarm_sortierer.py
    dest: "{{ paperless_install_path }}/scripts/alarm_sortierer.py"
    owner: paperless-ngx
    group: paperless-ngx
    mode: "0644"

- name: Alarm-Sortierer Aufruf bereitstellen
  ansible.builtin.template:
    src: alarm-sortierer.j2
    dest: /usr/local/sbin/alarm-sortierer
    owner: root
    group: root
    mode: "0750"

- name: Alarm-Sortierer systemd-Units bereitstellen
  ansible.builtin.template:
    src: "alarm-sortierer.{{ item }}.j2"
    dest: "/etc/systemd/system/alarm-sortierer.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  register: alarm_sortierer_units

- name: Alarm-Sortierer Timer aktivieren
  ansible.builtin.systemd:
    name: alarm-sortierer.timer
    daemon_reload: "{{ alarm_sortierer_units.changed }}"
    enabled: true
    state: started
  # Im --check der PR-Pipeline existiert die Unit beim ersten Mal noch nicht
  ignore_errors: "{{ ansible_check_mode }}"
