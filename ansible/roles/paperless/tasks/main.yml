---
- name: paperless-ngx Gruppe erstellen
  group:
    name: paperless-ngx
    system: yes
    state: present

- name: paperless-ngx Benutzer erstellen
  user:
    name: paperless-ngx
    group: paperless-ngx
    system: yes
    shell: /bin/bash
    create_home: yes

- name: paperless-ngx Ordnerstruktur erstellen
  file:
    path: "{{ item }}"
    state: directory
    owner: paperless-ngx
    group: paperless-ngx
    mode: '0755'
  loop:
    - "{{ paperless_install_path }}"
    - "{{ paperless_install_path }}/scripts"
    - "{{ paperless_proton_data }}"

# Paperless runs as uid/gid 1000 inside the container and must be able to
# write these mounts (e.g. media/media.lock). The host user paperless-ngx has
# a different uid, so owning them by it breaks every consume.
- name: paperless-ngx beschreibbare Ordner fuer den Container-User
  file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'
  loop:
    - "{{ paperless_install_path }}/data"
    - "{{ paperless_install_path }}/media"
    - "{{ paperless_install_path }}/export"
    - "{{ paperless_install_path }}/consume"

- name: Python Skript (ai_tagger.py) auf den Server kopieren
  copy:
    src: ai_tagger.py
    dest: "{{ paperless_install_path }}/scripts/ai_tagger.py"
    owner: paperless-ngx
    group: paperless-ngx
    mode: '0755'


- name: proton-bridge Build-Context (Dockerfile) kopieren
  copy:
    src: proton-bridge
    dest: "{{ paperless_install_path }}/"
    owner: paperless-ngx
    group: paperless-ngx
    mode: '0644'

- name: paperless-ngx docker-compose.yml erstellen
  template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_install_path }}/docker-compose.yml"

# Vor compose up: sonst ist Port 1025 kurz fuer das ganze LAN offen.
- name: Allow-List fuer das Bridge-SMTP bereitstellen
  template:
    src: bridge-smtp-allowlist.service.j2
    dest: /etc/systemd/system/bridge-smtp-allowlist.service
    owner: root
    group: root
    mode: '0644'
  register: bridge_allowlist_unit

# restarted statt started, damit neue IPs aus alert_smtp_allowed greifen
- name: Allow-List fuer das Bridge-SMTP aktivieren
  systemd:
    name: bridge-smtp-allowlist
    daemon_reload: "{{ bridge_allowlist_unit.changed }}"
    enabled: true
    state: "{{ 'restarted' if bridge_allowlist_unit.changed else 'started' }}"
  # Im --check der PR-Pipeline existiert die Unit beim ersten Mal noch nicht
  ignore_errors: "{{ ansible_check_mode }}"

- name: paperless-ngx Container starten
  command: docker compose up -d --build
  args:
    chdir: "{{ paperless_install_path }}"
