---
# Pruefung nach dem Deploy, aufgerufen von verify.yml
- name: Container pruefen
  ansible.builtin.include_role:
    name: container_health
  vars:
    container_health_dir: "{{ paperless_install_path }}"

- name: Paperless-Login antwortet
  ansible.builtin.uri:
    url: http://localhost:8010/accounts/login/

- name: Keine offenen Paperless-Migrationen
  ansible.builtin.command: docker exec paperless-ngx-webserver-1 python3 manage.py showmigrations
  register: paperless_migrations
  changed_when: false
  check_mode: false
  failed_when: paperless_migrations.rc != 0 or '[ ]' in paperless_migrations.stdout

- name: Alarm-Sortierer Timer laeuft
  ansible.builtin.command: systemctl is-active alarm-sortierer.timer
  changed_when: false
  check_mode: false

- name: Alarm-Sortierer kommt an die Bridge (Trockenlauf)
  ansible.builtin.command: /usr/local/sbin/alarm-sortierer --trocken
  changed_when: false
  check_mode: false
