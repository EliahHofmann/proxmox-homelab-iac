---
- name: Pipeline-Schluessel dieses Laufs bestimmen
  command: ssh-keygen -y -f "{{ ssh_access_private_key }}"
  register: ssh_access_own
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false
  no_log: true

- name: Schluessel aus Vault lesen
  set_fact:
    ssh_access_keys: "{{ ssh_access_keys_raw | ssh_access_parse_keys }}"
    ssh_access_pipeline_body: "{{ (ssh_access_own.stdout | ssh_access_parse_keys | first | default({'body': ''})).body }}"

# Schutz gegen Aussperren: nur schreiben, wenn der Besitzer-Schluessel UND der
# Schluessel dieses Laufs in der Liste stehen
- name: Schluesselliste ist vollstaendig?
  set_fact:
    ssh_access_ok: "{{ ssh_access_keys | ssh_access_keys_safe(ssh_access_pipeline_body) }}"

- name: root-Verzeichnis .ssh
  file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: authorized_keys schreiben (Pipeline-Schluessel nur vom Runner)
  template:
    src: authorized_keys.j2
    dest: /root/.ssh/authorized_keys
    owner: root
    group: root
    mode: '0600'
    backup: yes
  when: ssh_access_ok | bool

- name: authorized_keys bleibt unveraendert
  debug:
    msg: "Uebersprungen: secret/proxmox ssh_public_key braucht den Besitzer- und den Pipeline-Schluessel"
  when: not (ssh_access_ok | bool)

# Ungueltige Datei sofort wieder entfernen, sonst startet sshd nach dem
# naechsten Neustart nicht mehr
- name: sshd nur mit Schluessel
  block:
    - name: sshd-Haertung ablegen
      template:
        src: 10-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: '0644'
      register: ssh_access_sshd
      notify: sshd neu laden

    - name: sshd-Konfiguration pruefen
      command: /usr/sbin/sshd -t
      changed_when: false
      when: ssh_access_sshd.changed and not ansible_check_mode
  rescue:
    - name: Ungueltige sshd-Haertung entfernen
      file:
        path: /etc/ssh/sshd_config.d/10-hardening.conf
        state: absent

    - name: Abbruch melden
      fail:
        msg: "sshd -t lehnt die Haertung ab - Datei entfernt, sshd unveraendert"
