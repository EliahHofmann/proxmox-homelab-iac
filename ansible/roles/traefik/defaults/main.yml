---
#Docker-Compose
CF_DNS_API_TOKEN: "{{ lookup('env', 'CF_DNS_API_TOKEN') }}"
CF_API_TOKEN: "{{ lookup('env', 'CF_API_TOKEN') }}"
subdomain: "{{ lookup('env', 'SUBDOMAIN') }}"
domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
docker_dest: "/opt/traefik"

#Let's Encrypt Email
email_letsEncrypt: "{{ lookup('env', 'EMAIL_LETSENCRYPT') }}"

#Config destination
config_dest: "/opt/traefik/config"

#Vaultwarden
vault_subdomain: "{{ lookup('env', 'VAULT_SUBDOMAIN') }}"
vault_internal_ip: "{{ hostvars[groups['tag_vaultwarden'][0]]['ansible_host'] }}"
vault_internal_port: "8080"

#Nextcloud
nextcloud_subdomain: "{{ lookup('env', 'NEXTCLOUD_SUBDOMAIN') }}"
nextcloud_internal_ip: "192.168.178.80"

#Office-Nextcloud (Collabora)
office_subdomain: "{{ lookup('env', 'OFFICE_SUBDOMAIN') }}"
office_internal_ip: "{{ hostvars[groups['tag_collabora'][0]]['ansible_host'] }}"
office_internal_port: "9980"

#Immich
immich_subdomain: "{{ lookup('env', 'IMMICH_SUBDOMAIN') }}"
immich_internal_ip: "{{ hostvars[groups['tag_immich'][0]]['ansible_host'] }}"
immich_internal_port: "2283"

#Paperless
paperless_subdomain: "{{ lookup('env', 'PAPERLESS_SUBDOMAIN') }}"
paperless_internal_ip: "{{ hostvars[groups['tag_paperless'][0]]['ansible_host'] }}"
paperless_internal_port: "8010"

#Finance (Firefly III)
finance_subdomain: "finanzen"
importer_subdomain: "importer"   # nur LAN, siehe finance.yml.j2
# ntfy muss oeffentlich erreichbar sein, damit der Bericht auch unterwegs
# ankommt. Schutz uebernimmt ntfy selbst (deny-all + Anmeldung).
ntfy_subdomain: "ntfy"
finance_internal_ip: "{{ hostvars[groups['tag_actualbudget'][0]]['ansible_host'] }}"