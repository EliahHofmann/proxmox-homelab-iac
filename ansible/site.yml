---
# Zuerst: Downloads aus dem Internet bremsen, damit schon die folgenden
# Rollen die schmale Leitung nicht fuellen. Tailscale und Cloudflared nicht:
# ueber sie kommen die Zugriffe des Besitzers von unterwegs herein.
- name: Internet-Drossel
  hosts: proxmox_all_lxc, proxmox_all_qemu, !Kali-Linux-Prax, !Sandbox, !Minecraft, !tag_tailscale, !tag_cloudflared
  become: true
  roles:
    - internet_drossel

# Vor der Basis-Konfiguration: dort stellen alle Gaeste apt auf ihn um
- name: Paket-Zwischenspeicher
  hosts: tag_monitoring
  become: true
  roles:
    - apt_cache

- name: Basis-Konfiguration für alle Server
  hosts: proxmox_all_lxc, proxmox_all_qemu, !Nextcloud, !Kali-Linux-Prax, !Sandbox, !Minecraft
  become: true
  roles:
    - common

# Wer sich per SSH anmelden darf, fuer jeden erreichbaren Server (Nextcloud dabei)
- name: SSH-Zugang
  hosts: proxmox_all_lxc, proxmox_all_qemu, !Kali-Linux-Prax, !Sandbox, !Minecraft
  become: true
  roles:
    - ssh_access

- name: IPv6 aus (Voraussetzung fuer den Absender-Filter der Firewall)
  hosts: proxmox_all_lxc, proxmox_all_qemu, !Kali-Linux-Prax, !Sandbox, !Minecraft
  become: true
  roles:
    - ipv6_off

# Metriken fuer Prometheus auf jedem Server. Nextcloud ist dabei (TurnKey, sonst
# ausserhalb von site.yml); die Monitoring-VM hat ihren eigenen Exporter-Container.
- name: Node-Exporter
  hosts: proxmox_all_lxc, proxmox_all_qemu, !Kali-Linux-Prax, !Sandbox, !Minecraft, !tag_monitoring
  become: true
  roles:
    - node_exporter

- name: Setup Vaultwarden Dienst
  hosts: tag_vaultwarden
  become: true
  roles:
    - vaultwarden

- name: Setup Traefik Config Dienst
  hosts: tag_traefik
  become: true
  roles:
    - traefik

- name: Setup Collabora Dienst
  hosts: tag_collabora
  become: true
  roles:
    - collabora

- name: Setup Adguard Dienst
  hosts: tag_adguard
  become: true
  roles:
    - adguard

- name: Setup Cloudflared Dienst
  hosts: tag_cloudflared
  become: true
  roles:
    - cloudflared

- name: Setup Tailscale Subnet-Router
  hosts: tag_tailscale
  become: true
  roles:
    - tailscale

- name: Setup Monitoring Dienst
  hosts: tag_monitoring
  become: true
  roles:
    - monitoring

- name: Setup Immich Dienst
  hosts: tag_immich
  become: true
  roles:
    - immich

- name: Setup Paperless Dienst
  hosts: tag_paperless
  become: true
  roles:
    - paperless

- name: Setup Firefly III (Finance) Dienst
  hosts: tag_actualbudget
  become: true
  roles:
    - finance

- name: Setup Jellyfin Dienst
  hosts: tag_jellyfin
  become: true
  roles:
    - jellyfin

- name: Deploy node-exporter to all guest VMs
  hosts: proxmox_all_lxc, proxmox_all_qemu, !Nextcloud, !Kali-Linux-Prax, !Sandbox, !Minecraft
