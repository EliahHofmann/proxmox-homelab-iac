---
# Prueft nach jedem Deploy jeden Dienst wirklich (Container gesund, Soll-Image,
# Funktions-Check, keine Drossel). Laeuft in der Pipeline nach dem Deploy und
# von Hand ueber den Ops-Workflow. Rot = Mail an den Besitzer.

- name: Pruefe vaultwarden
  hosts: tag_vaultwarden
  become: yes
  gather_facts: no
  tasks:
    - name: vaultwarden pruefen
      include_role:
        name: vaultwarden
        tasks_from: verify

